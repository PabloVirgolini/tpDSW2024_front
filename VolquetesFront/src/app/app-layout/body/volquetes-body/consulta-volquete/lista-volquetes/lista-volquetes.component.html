<div class="tipos-volquete-list-container">
  <h1 class="tipos-volquete-title">Volquetes</h1>

  <!-- Aquí agregamos el componente ListaVolquetesComponent -->
  <app-lista-volquetes></app-lista-volquetes>  <!-- Este es el lugar donde importamos el componente -->

  <!-- Modal para agregar o editar volquete -->
  <div *ngIf="isAddingNew || isEditing" class="modal">
    <div class="modal-content">
      <h2>{{ isAddingNew ? 'Agregar Volquete' : 'Editar Volquete' }}</h2>
      <form [formGroup]="volqueteForm" (ngSubmit)="onSubmit()">
        <!-- Marca -->
        <label for="marca">Marca Volquete:</label>
        <input
          id="marca"
          formControlName="marca"
          required
          placeholder="Ej: Hitachi"
        />

        <!-- Fecha Fabricacion -->
        <label for="fecha_fabricacion">Fecha Fabricacion:</label>
        <input
          id="fecha_fabricacion"
          formControlName="fecha_fabricacion"
          required
          type="date"
        />

        <!-- Fecha Compra -->
        <label for="fecha_compra">Fecha Compra:</label>
        <input
          id="fecha_compra"
          formControlName="fecha_compra"
          required
          type="date"
        />

        <!-- Tipo Volquete -->
        <label for="tipoVolquete">Selecciona Tipo de Volquete:</label>
        <select id="tipoVolquete" formControlName="tipoVolquete">
          <option *ngFor="let tipo of tipoVolquetes" [value]="tipo.id">{{ tipo.descripcion_tipo_volquete }}</option>
        </select>

        <!-- Botones -->
        <button type="submit">{{ isAddingNew ? 'Agregar' : 'Guardar' }}</button>
        <button type="button" (click)="cancelEdit()">Cancelar</button>
      </form>
    </div>
  </div>
</div>
